name: AE Hot Loader macOS

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "core/**"
      - "agent/**"
      - "wrapper/**"
      - "ui/**"
      - "INSTALL.command"
      - "STAGE_IMPLEMENTATION.command"
      - "COLLECT_LOGS.command"
      - ".github/workflows/mac-ci.yml"
      - "tools/verify_shell_metadata.py"
      - "docs/**"
      - "tools/**"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: ae-hot-loader-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-apple-darwin
          components: rustfmt

      - name: Static checks
        run: |
          set -euo pipefail
          cargo fmt --manifest-path core/Cargo.toml -- --check
          python3 tools/verify_shell_metadata.py core/build.rs wrapper/AEHotLoader.cpp
          cargo fmt --manifest-path agent/Cargo.toml -- --check
          zsh -n INSTALL.command
          zsh -n STAGE_IMPLEMENTATION.command
          zsh -n COLLECT_LOGS.command
          python3 tools/verify_shell_contract.py core/build.rs core/src/lib.rs wrapper/AEHotLoader.cpp agent/native/ShellReloader.cpp
          xcrun clang++ -std=c++17 -arch arm64 -Wall -Wextra -Wpedantic -Werror -fsyntax-only wrapper/AEHotLoader.cpp
          xcrun clang++ -std=c++17 -arch arm64 -Wall -Wextra -Wpedantic -Werror -fsyntax-only agent/native/ShellReloader.cpp

      - name: Build default implementation
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-ae-hot-loader
          AE_HOT_LOADER_IMPL_LABEL: default-v1
        run: |
          set -euo pipefail
          cargo build --manifest-path core/Cargo.toml --release --target aarch64-apple-darwin

      - name: Build candidate implementation
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-ae-hot-loader-candidate
          AE_HOT_LOADER_IMPL_LABEL: candidate-v2
        run: |
          set -euo pipefail
          cargo build --manifest-path core/Cargo.toml --release --target aarch64-apple-darwin

      - name: Build AEGP agent
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-ae-hot-loader
        run: |
          set -euo pipefail
          cargo build --manifest-path agent/Cargo.toml --release --target aarch64-apple-darwin

      - name: Build control shell
        run: |
          set -euo pipefail
          mkdir -p build-ae-hot-loader
          xcrun clang++ \
            -std=c++17 -O2 -arch arm64 -mmacosx-version-min=11.0 -dynamiclib -fvisibility=hidden \
            wrapper/AEHotLoader.cpp \
            -o build-ae-hot-loader/AEHotLoaderControlShell

      - name: Assemble and sign
        run: |
          set -euo pipefail
          TRIPLE=aarch64-apple-darwin
          ROOT="target-ae-hot-loader/$TRIPLE/release"
          CANDIDATE_ROOT="target-ae-hot-loader-candidate/$TRIPLE/release"

          SHELL="dist/AEHotLoaderControlShell.plugin"
          mkdir -p "$SHELL/Contents/MacOS" "$SHELL/Contents/Frameworks" "$SHELL/Contents/Resources"
          cp build-ae-hot-loader/AEHotLoaderControlShell "$SHELL/Contents/MacOS/AEHotLoaderControlShell"
          cp "$ROOT/libae_hot_loader_core.dylib" "$SHELL/Contents/Frameworks/libae_hot_loader_core.dylib"
          cp "$ROOT/ae_hot_loader_core.rsrc" "$SHELL/Contents/Resources/AEHotLoaderControlShell.rsrc"
          cp "$ROOT/ae_hot_loader_core_PkgInfo" "$SHELL/Contents/PkgInfo"
          cp "$ROOT/ae_hot_loader_core_Info.plist" "$SHELL/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleExecutable AEHotLoaderControlShell' "$SHELL/Contents/Info.plist" || /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string AEHotLoaderControlShell' "$SHELL/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.os3kov.AEHotLoader.ControlShell' "$SHELL/Contents/Info.plist" || /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string com.os3kov.AEHotLoader.ControlShell' "$SHELL/Contents/Info.plist"
          codesign --force --sign - "$SHELL/Contents/Frameworks/libae_hot_loader_core.dylib"
          codesign --force --deep --sign - "$SHELL"

          AGENT="dist/AEHotLoaderAgent.plugin"
          mkdir -p "$AGENT/Contents/MacOS" "$AGENT/Contents/Resources"
          cp "$ROOT/libae_hot_loader_agent.dylib" "$AGENT/Contents/MacOS/AEHotLoaderAgent"
          cp "$ROOT/ae_hot_loader_agent.rsrc" "$AGENT/Contents/Resources/AEHotLoaderAgent.rsrc"
          cp "$ROOT/ae_hot_loader_agent_PkgInfo" "$AGENT/Contents/PkgInfo"
          cp "$ROOT/ae_hot_loader_agent_Info.plist" "$AGENT/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleExecutable AEHotLoaderAgent' "$AGENT/Contents/Info.plist" || /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string AEHotLoaderAgent' "$AGENT/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.os3kov.AEHotLoader.Agent' "$AGENT/Contents/Info.plist" || /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string com.os3kov.AEHotLoader.Agent' "$AGENT/Contents/Info.plist"
          codesign --force --deep --sign - "$AGENT"

          cp "$CANDIDATE_ROOT/libae_hot_loader_core.dylib" dist/AEHotLoaderControlImpl-candidate.dylib
          codesign --force --sign - dist/AEHotLoaderControlImpl-candidate.dylib

          codesign --verify --deep --strict "$SHELL"
          codesign --verify --deep --strict "$AGENT"
          codesign --verify --strict dist/AEHotLoaderControlImpl-candidate.dylib
          plutil -lint "$SHELL/Contents/Info.plist"
          plutil -lint "$AGENT/Contents/Info.plist"

          nm -gU "$SHELL/Contents/MacOS/AEHotLoaderControlShell" | grep -E 'PluginDataEntryFunction2|EffectMain|AEHotLoader_ShellReload|AEHotLoader_ShellABI|AEHotLoader_ShellKey'
          nm -gU "$AGENT/Contents/MacOS/AEHotLoaderAgent" | grep 'EntryPointFunc'
          nm -gU dist/AEHotLoaderControlImpl-candidate.dylib | grep -E 'EffectMain|AEHotLoader_ImplementationABI|AEHotLoader_ImplementationStateABI|AEHotLoader_ImplementationKey|AEHotLoader_ImplementationLabel|AEHotLoader_ImplementationRuntimeABI|AEHotLoader_SetGeneration'
          strings dist/AEHotLoaderControlImpl-candidate.dylib | grep 'candidate-v2'
          for impl in "$SHELL/Contents/Frameworks/libae_hot_loader_core.dylib" dist/AEHotLoaderControlImpl-candidate.dylib; do
            if otool -L "$impl" | tail -n +2 | grep -E '@(rpath|loader_path|executable_path)'; then
              echo "ERROR: hot-reload implementation has relative/private dylib dependencies: $impl"
              exit 6
            fi
          done
          for bin in             "$SHELL/Contents/MacOS/AEHotLoaderControlShell"             "$SHELL/Contents/Frameworks/libae_hot_loader_core.dylib"             "$AGENT/Contents/MacOS/AEHotLoaderAgent"             dist/AEHotLoaderControlImpl-candidate.dylib; do
            xcrun vtool -show-build "$bin" | grep -Eq 'minos[[:space:]]+11\.0' || {
              echo "ERROR: unexpected macOS deployment target: $bin"
              xcrun vtool -show-build "$bin"
              exit 7
            }
          done

      - name: Smoke test bundled default to candidate reload ABI
        shell: bash
        run: |
          set -euo pipefail
          FAKE_HOME="$RUNNER_TEMP/ae-hot-loader-home"
          IMPL_DIR="$FAKE_HOME/Library/Application Support/AE Hot Loader/implementations/control"
          mkdir -p "$IMPL_DIR"

          cat > "$RUNNER_TEMP/shell_reload_smoke.cpp" <<'CPP'
          #include <cstdlib>
          #include <cstdio>
          #include <cstring>
          #include <dlfcn.h>
          #include <filesystem>

          using ReloadFn = int (*)(char*, std::size_t);

          int main(int argc, char** argv) {
              if (argc != 3) return 10;
              void* handle = dlopen(argv[1], RTLD_NOW | RTLD_LOCAL);
              if (!handle) {
                  std::fprintf(stderr, "dlopen shell failed: %s\n", dlerror());
                  return 11;
              }
              auto reload = reinterpret_cast<ReloadFn>(dlsym(handle, "AEHotLoader_ShellReload"));
              if (!reload) return 12;

              char initial[2048]{};
              int initial_result = reload(initial, sizeof(initial));
              std::printf("initial=%d %s\n", initial_result, initial);
              if (initial_result != 0 || std::strstr(initial, "default-v1") == nullptr) {
                  return 13;
              }

              const char* home = std::getenv("HOME");
              if (!home) return 14;
              std::filesystem::path current =
                  std::filesystem::path(home) /
                  "Library/Application Support/AE Hot Loader/implementations/control/current.dylib";
              std::filesystem::copy_file(
                  argv[2],
                  current,
                  std::filesystem::copy_options::overwrite_existing);

              char candidate[2048]{};
              int candidate_result = reload(candidate, sizeof(candidate));
              std::printf("candidate=%d %s\n", candidate_result, candidate);
              if (candidate_result != 0 || std::strstr(candidate, "candidate-v2") == nullptr) {
                  return 15;
              }

              char unchanged[2048]{};
              int unchanged_result = reload(unchanged, sizeof(unchanged));
              std::printf("unchanged=%d %s\n", unchanged_result, unchanged);
              if (unchanged_result != 1) return 16;

              std::filesystem::remove(current);

              char rollback[2048]{};
              const int rollback_result = reload(rollback, sizeof(rollback));
              std::printf("rollback=%d %s\n", rollback_result, rollback);
              if (rollback_result != 0 ||
                  std::strstr(rollback, "default-v1") == nullptr) {
                  return 17;
              }

              char rollback_unchanged[2048]{};
              const int rollback_unchanged_result =
                  reload(rollback_unchanged, sizeof(rollback_unchanged));
              std::printf(
                  "rollback-unchanged=%d %s\n",
                  rollback_unchanged_result,
                  rollback_unchanged);
              if (rollback_unchanged_result != 1) return 18;

              return 0;
          }
          CPP

          xcrun clang++ -std=c++17 -arch arm64 "$RUNNER_TEMP/shell_reload_smoke.cpp" -o "$RUNNER_TEMP/shell_reload_smoke"
          HOME="$FAKE_HOME" "$RUNNER_TEMP/shell_reload_smoke" \
            "$(pwd)/dist/AEHotLoaderControlShell.plugin/Contents/MacOS/AEHotLoaderControlShell" \
            "$(pwd)/dist/AEHotLoaderControlImpl-candidate.dylib"

      - name: Smoke test Agent shell discovery path
        shell: bash
        run: |
          set -euo pipefail
          FAKE_HOME="$RUNNER_TEMP/ae-hot-loader-agent-home"
          IMPL_DIR="$FAKE_HOME/Library/Application Support/AE Hot Loader/implementations/control"
          mkdir -p "$IMPL_DIR"
          cp dist/AEHotLoaderControlImpl-candidate.dylib "$IMPL_DIR/current.dylib"

          cat > "$RUNNER_TEMP/agent_discovery_smoke.cpp" <<'CPP'
          #include <cstdio>
          #include <cstring>
          #include <dlfcn.h>

          extern "C" int AEHotLoader_ReloadShells(char*, std::size_t);

          int main(int argc, char** argv) {
              if (argc != 2) return 20;

              void* shell = dlopen(argv[1], RTLD_NOW | RTLD_LOCAL);
              if (!shell) {
                  std::fprintf(stderr, "dlopen shell failed: %s\n", dlerror());
                  return 21;
              }

              char first[2048]{};
              const int first_result = AEHotLoader_ReloadShells(first, sizeof(first));
              std::printf("first=%d %s\n", first_result, first);
              if (first_result != 0 ||
                  std::strstr(first, "shells=1") == nullptr ||
                  std::strstr(first, "reloaded=1") == nullptr) {
                  return 22;
              }

              char second[2048]{};
              const int second_result = AEHotLoader_ReloadShells(second, sizeof(second));
              std::printf("second=%d %s\n", second_result, second);
              if (second_result != 1 ||
                  std::strstr(second, "unchanged=1") == nullptr) {
                  return 23;
              }

              return 0;
          }
          CPP

          xcrun clang++ -std=c++17 -arch arm64 \
            "$RUNNER_TEMP/agent_discovery_smoke.cpp" \
            agent/native/ShellReloader.cpp \
            -o "$RUNNER_TEMP/agent_discovery_smoke"

          HOME="$FAKE_HOME" "$RUNNER_TEMP/agent_discovery_smoke" \
            "$(pwd)/dist/AEHotLoaderControlShell.plugin/Contents/MacOS/AEHotLoaderControlShell"

      - name: Negative test duplicate shell key blocks all reloads
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/duplicate-shells"
          A="$ROOT/A.plugin/Contents/MacOS"
          B="$ROOT/B.plugin/Contents/MacOS"
          mkdir -p "$A" "$B"
          cp dist/AEHotLoaderControlShell.plugin/Contents/MacOS/AEHotLoaderControlShell "$A/ShellA"
          cp dist/AEHotLoaderControlShell.plugin/Contents/MacOS/AEHotLoaderControlShell "$B/ShellB"

          cat > "$RUNNER_TEMP/duplicate_shell_smoke.cpp" <<'CPP'
          #include <cstdio>
          #include <cstring>
          #include <dlfcn.h>

          extern "C" int AEHotLoader_ReloadShells(char*, std::size_t);

          int main(int argc, char** argv) {
              if (argc != 3) return 70;
              void* a = dlopen(argv[1], RTLD_NOW | RTLD_LOCAL);
              void* b = dlopen(argv[2], RTLD_NOW | RTLD_LOCAL);
              if (!a || !b) return 71;

              char message[2048]{};
              const int result =
                  AEHotLoader_ReloadShells(message, sizeof(message));
              std::printf("result=%d %s\n", result, message);

              if (result != -4203) return 72;
              if (std::strstr(message, "duplicate AE Hot Loader shell key") == nullptr) {
                  return 73;
              }
              if (std::strstr(message, "reloaded=0") == nullptr) return 74;
              return 0;
          }
          CPP

          xcrun clang++ -std=c++17 -arch arm64 \
            "$RUNNER_TEMP/duplicate_shell_smoke.cpp" \
            agent/native/ShellReloader.cpp \
            -o "$RUNNER_TEMP/duplicate_shell_smoke"

          "$RUNNER_TEMP/duplicate_shell_smoke" "$A/ShellA" "$B/ShellB"

      - name: Stress smoke MFR busy-swap gate
        shell: bash
        run: |
          set -euo pipefail
          FAKE_HOME="$RUNNER_TEMP/ae-hot-loader-mfr-home"
          IMPL_DIR="$FAKE_HOME/Library/Application Support/AE Hot Loader/implementations/control"
          mkdir -p "$IMPL_DIR"

          cat > "$RUNNER_TEMP/fake_impl.cpp" <<'CPP'
          #include <chrono>
          #include <cstddef>
          #include <cstdint>
          #include <cstdio>
          #include <cstring>
          #include <cstdlib>
          #include <thread>

          #ifndef IMPL_LABEL
          #define IMPL_LABEL "fake"
          #endif

          extern "C" __attribute__((visibility("default")))
          std::int32_t EffectMain(
              std::int32_t,
              void*,
              void*,
              void**,
              void*,
              void*) {
              std::this_thread::sleep_for(std::chrono::milliseconds(250));
              return 0;
          }

          extern "C" __attribute__((visibility("default")))
          std::uint32_t AEHotLoader_ImplementationABI() { return 2; }

          extern "C" __attribute__((visibility("default")))
          std::uint64_t AEHotLoader_ImplementationStateABI() { return 1; }

          static int Write(const char* value, char* output, std::size_t capacity) {
              if (!output || capacity == 0) return -1;
              std::snprintf(output, capacity, "%s", value);
              return 0;
          }

          extern "C" __attribute__((visibility("default")))
          int AEHotLoader_ImplementationKey(char* output, std::size_t capacity) {
              return Write("control", output, capacity);
          }

          extern "C" __attribute__((visibility("default")))
          int AEHotLoader_ImplementationLabel(char* output, std::size_t capacity) {
              return Write(IMPL_LABEL, output, capacity);
          }

          extern "C" __attribute__((visibility("default")))
          int AEHotLoader_ImplementationRuntimeABI(char* output, std::size_t capacity) {
              const char* value = std::getenv("AE_HOT_LOADER_TEST_RUNTIME_ABI");
              return Write(value ? value : "", output, capacity);
          }

          extern "C" __attribute__((visibility("default")))
          void AEHotLoader_SetGeneration(std::uint64_t) {}

          CPP

          RUNTIME_ABI="$(python3 -c 'import ctypes,sys; lib=ctypes.CDLL(sys.argv[1]); fn=lib.AEHotLoader_ImplementationRuntimeABI; fn.argtypes=[ctypes.c_char_p,ctypes.c_size_t]; fn.restype=ctypes.c_int; buf=ctypes.create_string_buffer(512); rc=fn(buf,len(buf)); (print(buf.value.decode("utf-8")) if rc == 0 else sys.exit(rc))' "$(pwd)/dist/AEHotLoaderControlShell.plugin/Contents/Frameworks/libae_hot_loader_core.dylib")"
          test -n "$RUNTIME_ABI"

          xcrun clang++ -std=c++17 -arch arm64 -mmacosx-version-min=11.0 -dynamiclib \
            -DIMPL_LABEL='"fake-v1"' "$RUNNER_TEMP/fake_impl.cpp" \
            -o "$RUNNER_TEMP/fake-v1.dylib"
          xcrun clang++ -std=c++17 -arch arm64 -mmacosx-version-min=11.0 -dynamiclib \
            -DIMPL_LABEL='"fake-v2"' "$RUNNER_TEMP/fake_impl.cpp" \
            -o "$RUNNER_TEMP/fake-v2.dylib"
          codesign --force --sign - "$RUNNER_TEMP/fake-v1.dylib"
          codesign --force --sign - "$RUNNER_TEMP/fake-v2.dylib"
          cp "$RUNNER_TEMP/fake-v1.dylib" "$IMPL_DIR/current.dylib"

          cat > "$RUNNER_TEMP/mfr_gate_smoke.cpp" <<'CPP'
          #include <chrono>
          #include <cstddef>
          #include <cstdint>
          #include <cstdlib>
          #include <cstdio>
          #include <dlfcn.h>
          #include <filesystem>
          #include <string>
          #include <thread>

          using ReloadFn = int (*)(char*, std::size_t);
          using EffectFn = std::int32_t (*)(std::int32_t, void*, void*, void**, void*, void*);

          int main(int argc, char** argv) {
              if (argc != 3) return 30;

              void* shell = dlopen(argv[1], RTLD_NOW | RTLD_LOCAL);
              if (!shell) return 31;

              auto reload = reinterpret_cast<ReloadFn>(dlsym(shell, "AEHotLoader_ShellReload"));
              auto effect = reinterpret_cast<EffectFn>(dlsym(shell, "EffectMain"));
              if (!reload || !effect) return 32;

              char first[1024]{};
              if (reload(first, sizeof(first)) != 0) return 33;

              std::thread render([&]() {
                  (void)effect(0, nullptr, nullptr, nullptr, nullptr, nullptr);
              });

              std::this_thread::sleep_for(std::chrono::milliseconds(40));

              const char* home = std::getenv("HOME");
              if (!home) return 34;
              std::filesystem::path current =
                  std::filesystem::path(home) /
                  "Library/Application Support/AE Hot Loader/implementations/control/current.dylib";
              std::filesystem::copy_file(
                  argv[2],
                  current,
                  std::filesystem::copy_options::overwrite_existing);

              char busy[1024]{};
              const int busy_result = reload(busy, sizeof(busy));
              std::printf("busy=%d %s\n", busy_result, busy);
              if (busy_result != -4112) return 35;

              render.join();

              char second[1024]{};
              const int second_result = reload(second, sizeof(second));
              std::printf("second=%d %s\n", second_result, second);
              if (second_result != 0) return 36;

              char unchanged[1024]{};
              const int unchanged_result = reload(unchanged, sizeof(unchanged));
              std::printf("unchanged=%d %s\n", unchanged_result, unchanged);
              if (unchanged_result != 1) return 37;

              return 0;
          }
          CPP

          xcrun clang++ -std=c++17 -arch arm64 -mmacosx-version-min=11.0 \
            "$RUNNER_TEMP/mfr_gate_smoke.cpp" -o "$RUNNER_TEMP/mfr_gate_smoke"

          AE_HOT_LOADER_TEST_RUNTIME_ABI="$RUNTIME_ABI" \
          HOME="$FAKE_HOME" "$RUNNER_TEMP/mfr_gate_smoke" \
            "$(pwd)/dist/AEHotLoaderControlShell.plugin/Contents/MacOS/AEHotLoaderControlShell" \
            "$RUNNER_TEMP/fake-v2.dylib"

      - name: Negative test incompatible implementation rollback
        shell: bash
        run: |
          set -euo pipefail
          FAKE_HOME="$RUNNER_TEMP/ae-hot-loader-negative-home"
          IMPL_DIR="$FAKE_HOME/Library/Application Support/AE Hot Loader/implementations/control"
          mkdir -p "$IMPL_DIR"

          cat > "$RUNNER_TEMP/bad_impl.cpp" <<'CPP'
          #include <cstddef>
          #include <cstdint>
          #include <cstdio>
          #include <cstring>
          extern "C" int EffectMain(...) { return 0; }
          extern "C" std::uint32_t AEHotLoader_ImplementationABI() { return 2; }
          extern "C" std::uint64_t AEHotLoader_ImplementationStateABI() { return 1; }
          extern "C" int AEHotLoader_ImplementationKey(char* out, std::size_t cap) {
              if (!out || cap == 0) return -1;
              std::snprintf(out, cap, "%s", "wrong-control");
              return 0;
          }
          extern "C" int AEHotLoader_ImplementationLabel(char* out, std::size_t cap) {
              if (!out || cap == 0) return -1;
              std::snprintf(out, cap, "%s", "bad-key");
              return 0;
          }
          extern "C" int AEHotLoader_ImplementationRuntimeABI(char* out, std::size_t cap) {
              if (!out || cap == 0) return -1;
              std::snprintf(out, cap, "%s", "test-runtime-abi");
              return 0;
          }
          extern "C" void AEHotLoader_SetGeneration(std::uint64_t) {}
          CPP

          xcrun clang++ -std=c++17 -arch arm64 -dynamiclib "$RUNNER_TEMP/bad_impl.cpp" -o "$RUNNER_TEMP/bad_impl.dylib"

          cat > "$RUNNER_TEMP/rollback_smoke.cpp" <<'CPP'
          #include <cstdio>
          #include <cstring>
          #include <cstdlib>
          #include <dlfcn.h>
          #include <filesystem>

          using ReloadFn = int (*)(char*, std::size_t);

          int main(int argc, char** argv) {
              if (argc != 4) return 30;
              const char* shell_path = argv[1];
              const char* good = argv[2];
              const char* bad = argv[3];

              void* shell = dlopen(shell_path, RTLD_NOW | RTLD_LOCAL);
              if (!shell) return 31;
              auto reload = reinterpret_cast<ReloadFn>(dlsym(shell, "AEHotLoader_ShellReload"));
              if (!reload) return 32;

              const char* home = std::getenv("HOME");
              std::filesystem::path dest =
                  std::filesystem::path(home) /
                  "Library/Application Support/AE Hot Loader/implementations/control/current.dylib";
              std::filesystem::create_directories(dest.parent_path());

              std::filesystem::copy_file(good, dest, std::filesystem::copy_options::overwrite_existing);
              char first[1024]{};
              if (reload(first, sizeof(first)) != 0) return 33;

              std::filesystem::copy_file(bad, dest, std::filesystem::copy_options::overwrite_existing);
              char rejected[1024]{};
              const int bad_result = reload(rejected, sizeof(rejected));
              std::printf("bad=%d %s\n", bad_result, rejected);
              if (bad_result >= 0 || std::strstr(rejected, "key mismatch") == nullptr) return 34;

              std::filesystem::copy_file(good, dest, std::filesystem::copy_options::overwrite_existing);
              char final_msg[1024]{};
              const int final_result = reload(final_msg, sizeof(final_msg));
              std::printf("final=%d %s\n", final_result, final_msg);
              if (final_result != 1 || std::strstr(final_msg, "unchanged") == nullptr) return 35;

              return 0;
          }
          CPP

          xcrun clang++ -std=c++17 -arch arm64 "$RUNNER_TEMP/rollback_smoke.cpp" -o "$RUNNER_TEMP/rollback_smoke"
          HOME="$FAKE_HOME" "$RUNNER_TEMP/rollback_smoke" \
            "$(pwd)/dist/AEHotLoaderControlShell.plugin/Contents/MacOS/AEHotLoaderControlShell" \
            "$(pwd)/dist/AEHotLoaderControlImpl-candidate.dylib" \
            "$RUNNER_TEMP/bad_impl.dylib"

      - name: Negative test Rust runtime ABI mismatch rollback
        shell: bash
        run: |
          set -euo pipefail
          FAKE_HOME="$RUNNER_TEMP/ae-hot-loader-runtime-mismatch-home"
          IMPL_DIR="$FAKE_HOME/Library/Application Support/AE Hot Loader/implementations/control"
          mkdir -p "$IMPL_DIR"

          cat > "$RUNNER_TEMP/runtime_mismatch_impl.cpp" <<'CPP'
          #include <cstddef>
          #include <cstdint>
          #include <cstdio>

          extern "C" int EffectMain(...) { return 0; }
          extern "C" std::uint32_t AEHotLoader_ImplementationABI() { return 2; }
          extern "C" std::uint64_t AEHotLoader_ImplementationStateABI() { return 1; }

          static int Write(const char* value, char* out, std::size_t cap) {
              if (!out || cap == 0) return -1;
              std::snprintf(out, cap, "%s", value);
              return 0;
          }

          extern "C" int AEHotLoader_ImplementationKey(char* out, std::size_t cap) {
              return Write("control", out, cap);
          }
          extern "C" int AEHotLoader_ImplementationLabel(char* out, std::size_t cap) {
              return Write("runtime-mismatch", out, cap);
          }
          extern "C" int AEHotLoader_ImplementationRuntimeABI(char* out, std::size_t cap) {
              return Write("rustc-incompatible|aarch64-apple-darwin|after-effects=incompatible", out, cap);
          }
          extern "C" void AEHotLoader_SetGeneration(std::uint64_t) {}
          CPP

          xcrun clang++ -std=c++17 -arch arm64 -mmacosx-version-min=11.0 -dynamiclib \
            "$RUNNER_TEMP/runtime_mismatch_impl.cpp" \
            -o "$RUNNER_TEMP/runtime_mismatch_impl.dylib"
          codesign --force --sign - "$RUNNER_TEMP/runtime_mismatch_impl.dylib"

          cat > "$RUNNER_TEMP/runtime_mismatch_smoke.cpp" <<'CPP'
          #include <cstdlib>
          #include <cstdio>
          #include <cstring>
          #include <dlfcn.h>
          #include <filesystem>

          using ReloadFn = int (*)(char*, std::size_t);

          int main(int argc, char** argv) {
              if (argc != 4) return 60;
              void* shell = dlopen(argv[1], RTLD_NOW | RTLD_LOCAL);
              if (!shell) return 61;
              auto reload = reinterpret_cast<ReloadFn>(dlsym(shell, "AEHotLoader_ShellReload"));
              if (!reload) return 62;

              const char* home = std::getenv("HOME");
              if (!home) return 63;
              std::filesystem::path current =
                  std::filesystem::path(home) /
                  "Library/Application Support/AE Hot Loader/implementations/control/current.dylib";
              std::filesystem::create_directories(current.parent_path());

              std::filesystem::copy_file(
                  argv[2], current, std::filesystem::copy_options::overwrite_existing);
              char good[1024]{};
              if (reload(good, sizeof(good)) != 0) return 64;

              std::filesystem::copy_file(
                  argv[3], current, std::filesystem::copy_options::overwrite_existing);
              char mismatch[1024]{};
              const int mismatch_result = reload(mismatch, sizeof(mismatch));
              std::printf("mismatch=%d %s\n", mismatch_result, mismatch);
              if (mismatch_result != -4116 ||
                  std::strstr(mismatch, "runtime ABI mismatch") == nullptr) {
                  return 65;
              }

              std::filesystem::copy_file(
                  argv[2], current, std::filesystem::copy_options::overwrite_existing);
              char final_msg[1024]{};
              const int final_result = reload(final_msg, sizeof(final_msg));
              std::printf("final=%d %s\n", final_result, final_msg);
              if (final_result != 1 ||
                  std::strstr(final_msg, "unchanged") == nullptr) {
                  return 66;
              }

              return 0;
          }
          CPP

          xcrun clang++ -std=c++17 -arch arm64 "$RUNNER_TEMP/runtime_mismatch_smoke.cpp" \
            -o "$RUNNER_TEMP/runtime_mismatch_smoke"

          HOME="$FAKE_HOME" "$RUNNER_TEMP/runtime_mismatch_smoke" \
            "$(pwd)/dist/AEHotLoaderControlShell.plugin/Contents/MacOS/AEHotLoaderControlShell" \
            "$(pwd)/dist/AEHotLoaderControlImpl-candidate.dylib" \
            "$RUNNER_TEMP/runtime_mismatch_impl.dylib"

      - name: Negative test unterminated ABI strings
        shell: bash
        run: |
          set -euo pipefail
          FAKE_HOME="$RUNNER_TEMP/ae-hot-loader-unterminated-home"
          IMPL_DIR="$FAKE_HOME/Library/Application Support/AE Hot Loader/implementations/control"
          mkdir -p "$IMPL_DIR"

          cat > "$RUNNER_TEMP/unterminated_impl.cpp" <<'CPP'
          #include <cstddef>
          #include <cstdint>
          #include <cstdio>
          #include <cstring>
          extern "C" int EffectMain(...) { return 0; }
          extern "C" std::uint32_t AEHotLoader_ImplementationABI() { return 2; }
          extern "C" std::uint64_t AEHotLoader_ImplementationStateABI() { return 1; }
          extern "C" int AEHotLoader_ImplementationKey(char* out, std::size_t cap) {
              if (!out || cap == 0) return -1;
              const char key[] = "control";
              if (cap <= sizeof(key)) return -1;
              std::memcpy(out, key, sizeof(key));
              return 0;
          }
          extern "C" int AEHotLoader_ImplementationLabel(char* out, std::size_t cap) {
              if (!out || cap == 0) return -1;
              std::memset(out, 'X', cap);
              return 0;
          }
          extern "C" int AEHotLoader_ImplementationRuntimeABI(char* out, std::size_t cap) {
              if (!out || cap == 0) return -1;
              std::snprintf(out, cap, "%s", "test-runtime-abi");
              return 0;
          }
          extern "C" void AEHotLoader_SetGeneration(std::uint64_t) {}
          CPP

          xcrun clang++ -std=c++17 -arch arm64 -dynamiclib             "$RUNNER_TEMP/unterminated_impl.cpp"             -o "$IMPL_DIR/current.dylib"

          cat > "$RUNNER_TEMP/unterminated_smoke.cpp" <<'CPP'
          #include <cstdio>
          #include <cstring>
          #include <dlfcn.h>
          using ReloadFn = int (*)(char*, std::size_t);

          int main(int argc, char** argv) {
              if (argc != 2) return 50;
              void* shell = dlopen(argv[1], RTLD_NOW | RTLD_LOCAL);
              if (!shell) return 51;
              auto reload = reinterpret_cast<ReloadFn>(dlsym(shell, "AEHotLoader_ShellReload"));
              if (!reload) return 52;

              char message[1024]{};
              const int result = reload(message, sizeof(message));
              std::printf("result=%d %s\n", result, message);
              if (result != -4113) return 53;
              if (std::strstr(message, "not NUL-terminated") == nullptr) return 54;
              return 0;
          }
