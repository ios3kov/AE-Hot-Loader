          xcrun clang++ -std=c++17 -arch arm64             "$RUNNER_TEMP/unterminated_smoke.cpp"             -o "$RUNNER_TEMP/unterminated_smoke"

          HOME="$FAKE_HOME" "$RUNNER_TEMP/unterminated_smoke"             "$(pwd)/dist/AEHotLoaderControlShell.plugin/Contents/MacOS/AEHotLoaderControlShell"

