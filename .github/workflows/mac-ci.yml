name: AE Hot Loader macOS PoC

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "core/**"
      - "agent/**"
      - "wrapper/**"
      - "ui/**"
      - "INSTALL.command"
      - "STAGE_TEST_PROBES.command"
      - ".github/workflows/mac-ci.yml"
      - "docs/**"
      - "experiments/rust_effect_probe/**"
      - "experiments/rust_effect_probe_permissive/**"
  workflow_dispatch:

concurrency:
  group: ae-hot-loader-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt

      - name: Static checks
        run: |
          set -euo pipefail
          cargo fmt --manifest-path core/Cargo.toml -- --check
          cargo fmt --manifest-path agent/Cargo.toml -- --check
          cargo fmt --manifest-path experiments/rust_effect_probe/Cargo.toml -- --check
          cargo fmt --manifest-path experiments/rust_effect_probe_permissive/Cargo.toml -- --check
          zsh -n INSTALL.command
          zsh -n STAGE_TEST_PROBES.command
          xcrun clang++ -std=c++17 -arch arm64 -Wall -Wextra -Wpedantic -Werror -fsyntax-only wrapper/AEHotLoader.cpp
          xcrun clang++ -std=c++17 -arch arm64 -Wall -Wextra -Wpedantic -Werror -fsyntax-only agent/native/InternalLoader.cpp

      - name: Build effect bridge core
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-ae-hot-loader
        run: |
          set -euo pipefail
          cargo build --manifest-path core/Cargo.toml --release --target aarch64-apple-darwin

      - name: Build AEGP agent
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-ae-hot-loader
        run: |
          set -euo pipefail
          cargo build --manifest-path agent/Cargo.toml --release --target aarch64-apple-darwin

      - name: Build Rust effect probe
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-rust-effect-probe
        run: |
          set -euo pipefail
          cargo build --manifest-path experiments/rust_effect_probe/Cargo.toml --release --target aarch64-apple-darwin

      - name: Build permissive Rust effect probe
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-rust-effect-probe-permissive
        run: |
          set -euo pipefail
          cargo build --manifest-path experiments/rust_effect_probe_permissive/Cargo.toml --release --target aarch64-apple-darwin

      - name: Build effect wrapper
        run: |
          set -euo pipefail
          mkdir -p build-ae-hot-loader
          xcrun clang++ \
            -std=c++17 -O2 -arch arm64 -dynamiclib -fvisibility=hidden \
            wrapper/AEHotLoader.cpp \
            -o build-ae-hot-loader/AEHotLoaderBridge

      - name: Assemble and sign bundles
        run: |
          set -euo pipefail
          TRIPLE=aarch64-apple-darwin
          ROOT="target-ae-hot-loader/$TRIPLE/release"

          BRIDGE="dist/AEHotLoaderBridge.plugin"
          mkdir -p "$BRIDGE/Contents/MacOS" "$BRIDGE/Contents/Frameworks" "$BRIDGE/Contents/Resources"
          cp build-ae-hot-loader/AEHotLoaderBridge "$BRIDGE/Contents/MacOS/AEHotLoaderBridge"
          cp "$ROOT/libae_hot_loader_core.dylib" "$BRIDGE/Contents/Frameworks/libae_hot_loader_core.dylib"
          cp "$ROOT/ae_hot_loader_core.rsrc" "$BRIDGE/Contents/Resources/AEHotLoaderBridge.rsrc"
          cp "$ROOT/ae_hot_loader_core_PkgInfo" "$BRIDGE/Contents/PkgInfo"
          cp "$ROOT/ae_hot_loader_core_Info.plist" "$BRIDGE/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleExecutable AEHotLoaderBridge' "$BRIDGE/Contents/Info.plist" || /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string AEHotLoaderBridge' "$BRIDGE/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.os3kov.AEHotLoader.Bridge' "$BRIDGE/Contents/Info.plist" || /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string com.os3kov.AEHotLoader.Bridge' "$BRIDGE/Contents/Info.plist"
          codesign --force --sign - "$BRIDGE/Contents/Frameworks/libae_hot_loader_core.dylib"
          codesign --force --deep --sign - "$BRIDGE"

          AGENT="dist/AEHotLoaderAgent.plugin"
          mkdir -p "$AGENT/Contents/MacOS" "$AGENT/Contents/Resources"
          cp "$ROOT/libae_hot_loader_agent.dylib" "$AGENT/Contents/MacOS/AEHotLoaderAgent"
          cp "$ROOT/ae_hot_loader_agent.rsrc" "$AGENT/Contents/Resources/AEHotLoaderAgent.rsrc"
          cp "$ROOT/ae_hot_loader_agent_PkgInfo" "$AGENT/Contents/PkgInfo"
          cp "$ROOT/ae_hot_loader_agent_Info.plist" "$AGENT/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleExecutable AEHotLoaderAgent' "$AGENT/Contents/Info.plist" || /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string AEHotLoaderAgent' "$AGENT/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.os3kov.AEHotLoader.Agent' "$AGENT/Contents/Info.plist" || /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string com.os3kov.AEHotLoader.Agent' "$AGENT/Contents/Info.plist"
          codesign --force --deep --sign - "$AGENT"

          codesign --verify --deep --strict "$BRIDGE"
          codesign --verify --deep --strict "$AGENT"
          plutil -lint "$BRIDGE/Contents/Info.plist"
          plutil -lint "$AGENT/Contents/Info.plist"

          nm -gU "$BRIDGE/Contents/MacOS/AEHotLoaderBridge" | grep -E 'PluginDataEntryFunction2|EffectMain|LateEffectMain|AEHotLoader_RegisterLateEffect'
          nm -gU "$AGENT/Contents/MacOS/AEHotLoaderAgent" | grep 'EntryPointFunc'

          PROBE_ROOT="target-rust-effect-probe/$TRIPLE/release"
          PROBE="dist/AEHotLoaderRustProbe.plugin"
          mkdir -p "$PROBE/Contents/MacOS" "$PROBE/Contents/Resources"
          cp "$PROBE_ROOT/libae_hot_loader_rust_probe.dylib" "$PROBE/Contents/MacOS/AEHotLoaderRustProbe"
          cp "$PROBE_ROOT/ae_hot_loader_rust_probe.rsrc" "$PROBE/Contents/Resources/AEHotLoaderRustProbe.rsrc"
          printf 'eFKTFXTC' > "$PROBE/Contents/PkgInfo"
          cat > "$PROBE/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>English</string>
            <key>CFBundleExecutable</key><string>AEHotLoaderRustProbe</string>
            <key>CFBundleIdentifier</key><string>com.os3kov.AEHotLoader.RustProbe</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>AE Hot Loader Rust Probe</string>
            <key>CFBundlePackageType</key><string>eFKT</string>
            <key>CFBundleSignature</key><string>FXTC</string>
            <key>CFBundleVersion</key><string>1</string>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$PROBE"
          codesign --verify --deep --strict "$PROBE"
          plutil -lint "$PROBE/Contents/Info.plist"
          nm -gU "$PROBE/Contents/MacOS/AEHotLoaderRustProbe" | grep -E 'PluginDataEntryFunction2|EffectMain'

          PERMISSIVE_ROOT="target-rust-effect-probe-permissive/$TRIPLE/release"
          PERMISSIVE="dist/AEHotLoaderRustProbePermissive.plugin"
          mkdir -p "$PERMISSIVE/Contents/MacOS" "$PERMISSIVE/Contents/Resources"
          cp "$PERMISSIVE_ROOT/libae_hot_loader_rust_probe_permissive.dylib" "$PERMISSIVE/Contents/MacOS/AEHotLoaderRustProbePermissive"
          cp "$PERMISSIVE_ROOT/ae_hot_loader_rust_probe_permissive.rsrc" "$PERMISSIVE/Contents/Resources/AEHotLoaderRustProbePermissive.rsrc"
          printf 'eFKTFXTC' > "$PERMISSIVE/Contents/PkgInfo"
          cat > "$PERMISSIVE/Contents/Info.plist" <<'PLIST2'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>English</string>
            <key>CFBundleExecutable</key><string>AEHotLoaderRustProbePermissive</string>
            <key>CFBundleIdentifier</key><string>com.os3kov.AEHotLoader.RustProbe.Permissive</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>AE Hot Loader Rust Probe Permissive</string>
            <key>CFBundlePackageType</key><string>eFKT</string>
            <key>CFBundleSignature</key><string>FXTC</string>
            <key>CFBundleVersion</key><string>1</string>
          </dict>
          </plist>
          PLIST2
          codesign --force --deep --sign - "$PERMISSIVE"
          codesign --verify --deep --strict "$PERMISSIVE"
          plutil -lint "$PERMISSIVE/Contents/Info.plist"
          nm -gU "$PERMISSIVE/Contents/MacOS/AEHotLoaderRustProbePermissive" | grep -E 'PluginDataEntryFunction2|EffectMain'

      - name: Validate ScriptUI panel
        run: |
          set -euo pipefail
          test -f "ui/AE Hot Loader.jsx"
          grep -q 'Reload Plugins' "ui/AE Hot Loader.jsx"

      - name: Package test kit
        run: |
          set -euo pipefail
          mkdir -p package
          cp -R dist/AEHotLoaderAgent.plugin package/
          cp -R dist/AEHotLoaderRustProbe.plugin package/
          cp -R dist/AEHotLoaderRustProbePermissive.plugin package/
          cp INSTALL.command package/
          cp STAGE_TEST_PROBES.command package/
          cp "ui/AE Hot Loader.jsx" package/
          cp README.md package/
          chmod +x package/INSTALL.command package/STAGE_TEST_PROBES.command
          ditto -c -k --sequesterRsrc --keepParent package AEHotLoader-mac-arm64-poc.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AEHotLoader-mac-arm64-poc
          path: AEHotLoader-mac-arm64-poc.zip
          if-no-files-found: error
