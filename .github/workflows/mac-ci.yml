name: AE Hot Loader macOS PoC

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "core/**"
      - "agent/**"
      - "wrapper/**"
      - "ui/**"
      - "INSTALL.command"
      - "STAGE_TEST_PROBES.command"
      - "STAGE_IMPLEMENTATION.command"
      - ".github/workflows/mac-ci.yml"
      - "docs/**"
      - "experiments/rust_effect_probe/**"
      - "experiments/rust_effect_probe_permissive/**"
      - "experiments/dual_pipl/**"
      - "experiments/single_pipl_cpp_control/**"
  workflow_dispatch:

concurrency:
  group: ae-hot-loader-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt

      - name: Static checks
        run: |
          set -euo pipefail
          cargo fmt --manifest-path core/Cargo.toml -- --check
          cargo fmt --manifest-path agent/Cargo.toml -- --check
          cargo fmt --manifest-path experiments/rust_effect_probe/Cargo.toml -- --check
          cargo fmt --manifest-path experiments/rust_effect_probe_permissive/Cargo.toml -- --check
          cargo fmt --manifest-path experiments/dual_pipl/piplgen/Cargo.toml -- --check
          cargo fmt --manifest-path experiments/single_pipl_cpp_control/piplgen/Cargo.toml -- --check
          xcrun clang++ -std=c++17 -arch arm64 -Wall -Wextra -Wpedantic -Werror -fsyntax-only experiments/dual_pipl/wrapper/DualPiPL.cpp
          xcrun clang++ -std=c++17 -arch arm64 -Wall -Wextra -Wpedantic -Werror -fsyntax-only experiments/single_pipl_cpp_control/wrapper/SinglePiPL.cpp
          zsh -n INSTALL.command
          zsh -n STAGE_TEST_PROBES.command
          zsh -n STAGE_IMPLEMENTATION.command
          xcrun clang++ -std=c++17 -arch arm64 -Wall -Wextra -Wpedantic -Werror -fsyntax-only wrapper/AEHotLoader.cpp
          xcrun clang++ -std=c++17 -arch arm64 -Wall -Wextra -Wpedantic -Werror -fsyntax-only agent/native/InternalLoader.cpp
          xcrun clang++ -std=c++17 -arch arm64 -Wall -Wextra -Wpedantic -Werror -fsyntax-only agent/native/ShellReloader.cpp

      - name: Build effect bridge core
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-ae-hot-loader
        run: |
          set -euo pipefail
          cargo build --manifest-path core/Cargo.toml --release --target aarch64-apple-darwin

      - name: Build candidate implementation
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-ae-hot-loader-candidate
          AE_HOT_LOADER_IMPL_LABEL: candidate-v2
        run: |
          set -euo pipefail
          cargo build --manifest-path core/Cargo.toml --release --target aarch64-apple-darwin

      - name: Build AEGP agent
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-ae-hot-loader
        run: |
          set -euo pipefail
          cargo build --manifest-path agent/Cargo.toml --release --target aarch64-apple-darwin

      - name: Build Rust effect probe
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-rust-effect-probe
        run: |
          set -euo pipefail
          cargo build --manifest-path experiments/rust_effect_probe/Cargo.toml --release --target aarch64-apple-darwin

      - name: Build permissive Rust effect probe
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-rust-effect-probe-permissive
        run: |
          set -euo pipefail
          cargo build --manifest-path experiments/rust_effect_probe_permissive/Cargo.toml --release --target aarch64-apple-darwin

      - name: Build DualPiPL control
        run: |
          set -euo pipefail
          cargo build --manifest-path experiments/dual_pipl/piplgen/Cargo.toml --release
          mkdir -p build-controls
          xcrun clang++ -std=c++17 -O2 -arch arm64 -dynamiclib -fvisibility=hidden \
            experiments/dual_pipl/wrapper/DualPiPL.cpp \
            -o build-controls/AEHotLoaderDualPiPL

      - name: Build SinglePiPL C++ control
        run: |
          set -euo pipefail
          cargo build --manifest-path experiments/single_pipl_cpp_control/piplgen/Cargo.toml --release
          mkdir -p build-controls
          xcrun clang++ -std=c++17 -O2 -arch arm64 -dynamiclib -fvisibility=hidden \
            experiments/single_pipl_cpp_control/wrapper/SinglePiPL.cpp \
            -o build-controls/AEHotLoaderSinglePiPLCpp

      - name: Build effect wrapper
        run: |
          set -euo pipefail
          mkdir -p build-ae-hot-loader
          xcrun clang++ \
            -std=c++17 -O2 -arch arm64 -dynamiclib -fvisibility=hidden \
            wrapper/AEHotLoader.cpp \
            -o build-ae-hot-loader/AEHotLoaderBridge

      - name: Assemble and sign bundles
        run: |
          set -euo pipefail
          TRIPLE=aarch64-apple-darwin
          ROOT="target-ae-hot-loader/$TRIPLE/release"

          SHELL="dist/AEHotLoaderControlShell.plugin"
          mkdir -p "$SHELL/Contents/MacOS" "$SHELL/Contents/Frameworks" "$SHELL/Contents/Resources"
          cp build-ae-hot-loader/AEHotLoaderBridge "$SHELL/Contents/MacOS/AEHotLoaderControlShell"
          cp "$ROOT/libae_hot_loader_core.dylib" "$SHELL/Contents/Frameworks/libae_hot_loader_core.dylib"
          cp "$ROOT/ae_hot_loader_core.rsrc" "$SHELL/Contents/Resources/AEHotLoaderControlShell.rsrc"
          cp "$ROOT/ae_hot_loader_core_PkgInfo" "$SHELL/Contents/PkgInfo"
          cp "$ROOT/ae_hot_loader_core_Info.plist" "$SHELL/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleExecutable AEHotLoaderControlShell' "$SHELL/Contents/Info.plist" || /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string AEHotLoaderControlShell' "$SHELL/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.os3kov.AEHotLoader.ControlShell' "$SHELL/Contents/Info.plist" || /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string com.os3kov.AEHotLoader.ControlShell' "$SHELL/Contents/Info.plist"
          codesign --force --sign - "$SHELL/Contents/Frameworks/libae_hot_loader_core.dylib"
          codesign --force --deep --sign - "$SHELL"

          CANDIDATE_ROOT="target-ae-hot-loader-candidate/$TRIPLE/release"
          cp "$CANDIDATE_ROOT/libae_hot_loader_core.dylib" dist/AEHotLoaderControlImpl-candidate.dylib
          codesign --force --sign - dist/AEHotLoaderControlImpl-candidate.dylib

          AGENT="dist/AEHotLoaderAgent.plugin"
          mkdir -p "$AGENT/Contents/MacOS" "$AGENT/Contents/Resources"
          cp "$ROOT/libae_hot_loader_agent.dylib" "$AGENT/Contents/MacOS/AEHotLoaderAgent"
          cp "$ROOT/ae_hot_loader_agent.rsrc" "$AGENT/Contents/Resources/AEHotLoaderAgent.rsrc"
          cp "$ROOT/ae_hot_loader_agent_PkgInfo" "$AGENT/Contents/PkgInfo"
          cp "$ROOT/ae_hot_loader_agent_Info.plist" "$AGENT/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleExecutable AEHotLoaderAgent' "$AGENT/Contents/Info.plist" || /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string AEHotLoaderAgent' "$AGENT/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.os3kov.AEHotLoader.Agent' "$AGENT/Contents/Info.plist" || /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string com.os3kov.AEHotLoader.Agent' "$AGENT/Contents/Info.plist"
          codesign --force --deep --sign - "$AGENT"

          codesign --verify --deep --strict "$SHELL"
          codesign --verify --strict dist/AEHotLoaderControlImpl-candidate.dylib
          codesign --verify --deep --strict "$AGENT"
          plutil -lint "$SHELL/Contents/Info.plist"
          plutil -lint "$AGENT/Contents/Info.plist"

          nm -gU "$SHELL/Contents/MacOS/AEHotLoaderControlShell" | grep -E 'PluginDataEntryFunction2|EffectMain|AEHotLoader_ShellReload'
          nm -gU "$AGENT/Contents/MacOS/AEHotLoaderAgent" | grep 'EntryPointFunc'

          PROBE_ROOT="target-rust-effect-probe/$TRIPLE/release"
          PROBE="dist/AEHotLoaderRustProbe.plugin"
          mkdir -p "$PROBE/Contents/MacOS" "$PROBE/Contents/Resources"
          cp "$PROBE_ROOT/libae_hot_loader_rust_probe.dylib" "$PROBE/Contents/MacOS/AEHotLoaderRustProbe"
          cp "$PROBE_ROOT/ae_hot_loader_rust_probe.rsrc" "$PROBE/Contents/Resources/AEHotLoaderRustProbe.rsrc"
          printf 'eFKTFXTC' > "$PROBE/Contents/PkgInfo"
          cat > "$PROBE/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>English</string>
            <key>CFBundleExecutable</key><string>AEHotLoaderRustProbe</string>
            <key>CFBundleIdentifier</key><string>com.os3kov.AEHotLoader.RustProbe</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>AE Hot Loader Rust Probe</string>
            <key>CFBundlePackageType</key><string>eFKT</string>
            <key>CFBundleSignature</key><string>FXTC</string>
            <key>CFBundleVersion</key><string>1</string>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$PROBE"
          codesign --verify --deep --strict "$PROBE"
          plutil -lint "$PROBE/Contents/Info.plist"
          nm -gU "$PROBE/Contents/MacOS/AEHotLoaderRustProbe" | grep -E 'PluginDataEntryFunction2|EffectMain'

          PERMISSIVE_ROOT="target-rust-effect-probe-permissive/$TRIPLE/release"
          PERMISSIVE="dist/AEHotLoaderRustProbePermissive.plugin"
          mkdir -p "$PERMISSIVE/Contents/MacOS" "$PERMISSIVE/Contents/Resources"
          cp "$PERMISSIVE_ROOT/libae_hot_loader_rust_probe_permissive.dylib" "$PERMISSIVE/Contents/MacOS/AEHotLoaderRustProbePermissive"
          cp "$PERMISSIVE_ROOT/ae_hot_loader_rust_probe_permissive.rsrc" "$PERMISSIVE/Contents/Resources/AEHotLoaderRustProbePermissive.rsrc"
          printf 'eFKTFXTC' > "$PERMISSIVE/Contents/PkgInfo"
          cat > "$PERMISSIVE/Contents/Info.plist" <<'PLIST2'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>English</string>
            <key>CFBundleExecutable</key><string>AEHotLoaderRustProbePermissive</string>
            <key>CFBundleIdentifier</key><string>com.os3kov.AEHotLoader.RustProbe.Permissive</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>AE Hot Loader Rust Probe Permissive</string>
            <key>CFBundlePackageType</key><string>eFKT</string>
            <key>CFBundleSignature</key><string>FXTC</string>
            <key>CFBundleVersion</key><string>1</string>
          </dict>
          </plist>
          PLIST2
          codesign --force --deep --sign - "$PERMISSIVE"
          codesign --verify --deep --strict "$PERMISSIVE"
          plutil -lint "$PERMISSIVE/Contents/Info.plist"
          nm -gU "$PERMISSIVE/Contents/MacOS/AEHotLoaderRustProbePermissive" | grep -E 'PluginDataEntryFunction2|EffectMain'

          DUAL="dist/AEHotLoaderDualPiPL.plugin"
          mkdir -p "$DUAL/Contents/MacOS" "$DUAL/Contents/Resources" "$DUAL/Contents/Frameworks"
          cp build-controls/AEHotLoaderDualPiPL "$DUAL/Contents/MacOS/AEHotLoaderDualPiPL"
          cp experiments/dual_pipl/DualPiPL.rsrc "$DUAL/Contents/Resources/AEHotLoaderDualPiPL.rsrc"
          cp "$ROOT/libae_hot_loader_core.dylib" "$DUAL/Contents/Frameworks/libae_hot_loader_core.dylib"
          printf 'eFKTFXTC' > "$DUAL/Contents/PkgInfo"
          cat > "$DUAL/Contents/Info.plist" <<'PLIST3'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>AEHotLoaderDualPiPL</string>
            <key>CFBundleIdentifier</key><string>com.os3kov.AEHotLoader.DualPiPL</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>AE Hot Loader Dual PiPL</string>
            <key>CFBundlePackageType</key><string>eFKT</string>
            <key>CFBundleSignature</key><string>FXTC</string>
            <key>CFBundleVersion</key><string>1</string>
          </dict></plist>
          PLIST3
          codesign --force --sign - "$DUAL/Contents/Frameworks/libae_hot_loader_core.dylib"
          codesign --force --deep --sign - "$DUAL"
          codesign --verify --deep --strict "$DUAL"
          nm -gU "$DUAL/Contents/MacOS/AEHotLoaderDualPiPL" | grep -E 'PluginDataEntryFunction2|EffectMain'

          SINGLE="dist/AEHotLoaderSinglePiPLCpp.plugin"
          mkdir -p "$SINGLE/Contents/MacOS" "$SINGLE/Contents/Resources"
          cp build-controls/AEHotLoaderSinglePiPLCpp "$SINGLE/Contents/MacOS/AEHotLoaderSinglePiPLCpp"
          cp experiments/single_pipl_cpp_control/SinglePiPLCpp.rsrc "$SINGLE/Contents/Resources/AEHotLoaderSinglePiPLCpp.rsrc"
          printf 'eFKTFXTC' > "$SINGLE/Contents/PkgInfo"
          cat > "$SINGLE/Contents/Info.plist" <<'PLIST4'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>AEHotLoaderSinglePiPLCpp</string>
            <key>CFBundleIdentifier</key><string>com.os3kov.AEHotLoader.SinglePiPLCpp</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>AE Hot Loader Single PiPL C++</string>
            <key>CFBundlePackageType</key><string>eFKT</string>
            <key>CFBundleSignature</key><string>FXTC</string>
            <key>CFBundleVersion</key><string>1</string>
          </dict></plist>
          PLIST4
          codesign --force --deep --sign - "$SINGLE"
          codesign --verify --deep --strict "$SINGLE"
          nm -gU "$SINGLE/Contents/MacOS/AEHotLoaderSinglePiPLCpp" | grep -E 'PluginDataEntryFunction2|EffectMain'

      - name: Validate ScriptUI panel
        run: |
          set -euo pipefail
          test -f "ui/AE Hot Loader.jsx"
          grep -q 'Reload Plugins' "ui/AE Hot Loader.jsx"

      - name: Package test kit
        run: |
          set -euo pipefail
          mkdir -p package
          cp -R dist/AEHotLoaderAgent.plugin package/
          cp -R dist/AEHotLoaderControlShell.plugin package/
          cp dist/AEHotLoaderControlImpl-candidate.dylib package/
          cp INSTALL.command package/
          cp STAGE_IMPLEMENTATION.command package/
          cp "ui/AE Hot Loader.jsx" package/
          cp README.md package/
          chmod +x package/INSTALL.command package/STAGE_IMPLEMENTATION.command
          ditto -c -k --sequesterRsrc --keepParent package AEHotLoader-mac-arm64-poc.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AEHotLoader-mac-arm64-poc
          path: AEHotLoader-mac-arm64-poc.zip
          if-no-files-found: error
