name: AE Hot Loader research checks

on:
  push:
    branches: ["research/**"]
  pull_request:
    branches: [main, "research/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  panel-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Unified offline checks (Linux, no AE)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aehl-check-reports"
          python3 tools/run_research_checks.py --expected-commit "$GITHUB_SHA" --output-parent "$RUNNER_TEMP/aehl-check-reports"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unified-linux-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aehl-check-reports/*.zip
          if-no-files-found: error
          retention-days: 30

  native-syntax:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Unified offline checks (macOS arm64, no AE)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aehl-check-reports"
          python3 tools/run_research_checks.py --expected-commit "$GITHUB_SHA" --output-parent "$RUNNER_TEMP/aehl-check-reports"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unified-macos-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aehl-check-reports/*.zip
          if-no-files-found: error
          retention-days: 30
